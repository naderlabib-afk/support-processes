<!DOCTYPE html>
<html>
<head>
<title>Process Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
 --bg:#eef2f7;
 --card:white;
 --text:#2f3640;
 --accent:#40739e;
}
body.dark {
 --bg:#1e272e;
 --card:#2f3640;
 --text:#f5f6fa;
 --accent:#00a8ff;
}
body {
 margin:0;
 font-family:'Segoe UI',sans-serif;
 background:var(--bg);
 color:var(--text);
}

header{
 background:rgba(39,60,117,0.9);
 color:white;
 padding:15px;
 display:flex;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:100;
}

.container{
 max-width:900px;
 margin:auto;
 padding:20px;
}

input,textarea,select{
 width:100%;
 padding:10px;
 border-radius:8px;
 border:none;
 margin-bottom:10px;
}

.buttons button{
 margin:4px;
 padding:8px 12px;
 border:none;
 border-radius:20px;
 background:var(--accent);
 color:white;
 cursor:pointer;
}

.buttons button.active {
 background:#273c75;
 transform:scale(1.05);
}



.card{
 background:var(--card);
 padding:15px;
 border-radius:10px;
 margin-bottom:12px;
 box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.actions button{
 position: relative;
 margin-right:5px;
 padding:6px 10px;
 border-radius:6px;
 border:none;
 cursor:pointer;
}

.email{background:#00a8ff;color:white;}
.copy{background:#9c88ff;color:white;}
.fav{background:#fbc531;}
.fav.active{
 background:#e1b12c;
 box-shadow:0 0 5px #fbc531;
}

mark{
 background:yellow;
 color:black;
}

#backToTop{
 position:fixed;
 bottom:20px;
 left:20px;
 padding:12px;
 border-radius:50%;
 background:#40739e;
 color:white;
 border:none;
 cursor:pointer;
 display:none;
}

#adminPanel{
 display:none;
 background:#fff;
 padding:15px;
 margin:20px;
 border-radius:10px;
}

pre{
 background:rgba(0,0,0,0.05);
 padding:10px;
 border-radius:8px;
 white-space:pre-wrap;
}

/* ✅ COPY FEEDBACK STYLE (ADD HERE) */
.copy-feedback {
 position:absolute;
 right:10px;
 top:10px;
 background:#4cd137;
 color:white;
 padding:3px 8px;
 border-radius:6px;
 font-size:12px;
 opacity:0;
 transition:opacity 0.3s;
}
.actions button::before {
 content: "";
 position: absolute;
 bottom: 120%;
 left: 50%;
 transform: translateX(-50%);
 border: 5px solid transparent;
 border-top-color: #2f3640;
 opacity: 0;
 transition: opacity 0.2s;
}

.actions button:hover::before {
 opacity: 1;
}
.actions button:hover::after {
 opacity: 1;
 transform: translateX(-50%) translateY(-3px);
}
/* ✅ CUSTOM TOOLTIP */
.actions button::after {
 content: attr(data-tooltip); /* pulls text dynamically */
 position: absolute;
 bottom: 130%; /* appears above button */
 left: 50%;
 transform: translateX(-50%);
 background: #2f3640;
 color: #fff;
 padding: 4px 8px;
 border-radius: 5px;
 font-size: 11px;
 white-space: nowrap;
 opacity: 0;
 pointer-events: none;
 transition: opacity 0.2s ease;
 z-index: 1000;
}

/* Show on hover */
.actions button:hover::after {
 opacity: 1;
}

.card.copied .copy-feedback {
 opacity:1;
}

.card {
 position:relative;
}

/* ✅ SEARCH DROPDOWN */
.search-dropdown {
 position: absolute;
 top: 100%;
 left: 0;
 right: 0;
 background: white;
 border-radius: 8px;
 box-shadow: 0 6px 15px rgba(0,0,0,0.15);
 max-height: 250px;
 overflow-y: auto;
 z-index: 999;
 display: none;
}

.search-item {
 padding: 10px;
 cursor: pointer;
 border-bottom: 1px solid #eee;
}

.search-item:hover {
 background: #f1f2f6;
}



.search-item {
 padding: 10px;
 cursor: pointer;
 border-bottom: 1px solid #eee;
}

.search-item:hover {
 background: #f1f2f6;
}

.search-dropdown {
 position: absolute;
 top: 100%;
 left: 0;
 right: 0;
 background: white;
 border-radius: 8px;
 box-shadow: 0 6px 15px rgba(0,0,0,0.15);
 max-height: 250px;
 overflow-y: auto;
 z-index: 999;
 display: none;
}

.search-item {
 padding: 10px;
 cursor: pointer;
 border-bottom: 1px solid #eee;
}

.search-item:hover {
 background: #f1f2f6;
}

</style>
</head>

<body>

<header>
 🔧 Process Finder
 <button onclick="toggleTheme()">🌙</button>
</header>

<div class="container">

<div style="position:relative;">
  <input id="search" placeholder="Search...">
  <div id="searchDropdown" class="search-dropdown"></div>
</div>




<div class="buttons" id="filterButtons">
 <button onclick="setFilter(this,'')">All</button>
 <button onclick="setFilter(this,'FAVORITES')">⭐ Favorites</button>
 <button onclick="setFilter(this,'Contract')">Contract</button>
 <button onclick="setFilter(this,'Location')">Location</button>
 <button onclick="setFilter(this,'Customer')">Customer</button>
 <button onclick="setFilter(this,'Machine Type')">Machine</button>
 <button onclick="setFilter(this,'Part')">Part</button>
</div>

<h3>⭐ Favorites</h3>
<div id="favorites"></div>

<div id="results"></div>

</div>

<button id="backToTop" onclick="scrollToTop()">⬆</button>

<!-- ADMIN -->
<div id="adminPanel">
<h3>Admin Panel</h3>

<input id="adminPass" type="password" placeholder="Enter password">
<button onclick="unlockAdmin()">Unlock</button>

<div id="adminContent" style="display:none; margin-top:10px;">

<select id="cat">
<option value="Contract">Contract</option>
<option value="Location">Location</option>
<option value="Customer">Customer</option>
<option value="Machine Type">Machine Type</option>
<option value="Part">Part</option>
</select>

<input id="machine" placeholder="Machine Type">
<input id="issue" placeholder="Issue">
<textarea id="process" placeholder="Process"></textarea>

<button onclick="saveProcess()">💾 Save</button>
<button onclick="clearForm()">Clear</button>

<h4>All Processes</h4>
<div id="adminList"></div>

<button onclick="downloadJSON()">⬇ Download JSON</button>

</div>
</div>

<script>

function updateCategoryCounts(){
 const counts = {
  FAVORITES: favoritesArr.length
 };

 data.forEach(i=>{
  counts[i.category] = (counts[i.category] || 0) + 1;
 });

 const buttons = document.querySelectorAll('#filterButtons button');

 buttons.forEach(btn=>{
  const text = btn.innerText.replace(/\(.*\)/,'').trim();

  if(text === "All"){
   btn.innerText = `All (${data.length})`;
  }
  else if(text.includes("Favorites")){
   btn.innerText = `⭐ Favorites (${counts.FAVORITES || 0})`;
  }
  else{
   btn.innerText = `${text} (${counts[text] || 0})`;
  }
 });
}

const ADMIN_PASSWORD="1234";
let data=[];
let favoritesArr=JSON.parse(localStorage.getItem("favorites")||"[]");
let currentCategory="";
let editIndex=null;

/* SAFE HTML */
function escapeHTML(str){
 return str.replace(/[&<>"']/g,(m)=>(
 {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
 ));
}

/* HIGHLIGHT */
function highlight(text,k){
 if(!k) return text;
 const r=new RegExp(`(${k})`,'gi');
 return text.replace(r,'<mark>$1</mark>');
}

/* ADMIN */
function unlockAdmin(){
 if(adminPass.value===ADMIN_PASSWORD){
  adminContent.style.display="block";
  renderAdminList();
 }
}

function saveProcess(){
 const item={
  category:cat.value,
  machine_type:machine.value,
  issue:issue.value,
  process:process.value
 };

 if(editIndex!==null){
  data[editIndex]=item;
  editIndex=null;
 } else{
  data.push(item);
 }

 applyFilters();
 renderAdminList();
 clearForm();
updateCategoryCounts();
}

function clearForm(){
 machine.value="";
 issue.value="";
 process.value="";
}

function renderAdminList(){
 adminList.innerHTML="";
 data.forEach((d,i)=>{
  adminList.innerHTML+=`
  <div style="margin-bottom:6px;">
   <b>${escapeHTML(d.issue)}</b>
   <button onclick="editProcess(${i})">✏️</button>
   <button onclick="deleteProcess(${i})">❌</button>
  </div>`;
 });
}

function deleteProcess(i){
 if(confirm("Delete this process?")){
  data.splice(i,1);
  applyFilters();
  renderAdminList();
 }
}

function editProcess(i){
 const d=data[i];
 cat.value=d.category;
 machine.value=d.machine_type;
 issue.value=d.issue;
 process.value=d.process;
 editIndex=i;
}

/* FILTER + SORT */

function applyFilters(){
 const k=search.value.toLowerCase();

 let filtered=data.filter(i=>{
  const matchSearch=
   !k ||
   i.issue.toLowerCase().includes(k) ||
   i.process.toLowerCase().includes(k) ||
   i.category.toLowerCase().includes(k) ||
   i.machine_type.toLowerCase().includes(k);

let matchCat = !currentCategory || i.category === currentCategory;

/* ✅ ADD THIS BLOCK */
if(currentCategory === "FAVORITES"){
 matchCat = favoritesArr.includes(i.issue);
}
  return matchSearch && matchCat;
 });

/* ✅ Favorites first */
 filtered.sort((a,b)=>{
  return favoritesArr.includes(b.issue) - favoritesArr.includes(a.issue);
 });

 renderList(filtered,k);
 renderFavorites();
}

/* RENDER */
function renderList(list,k){
 results.innerHTML=`<h3>Results (${list.length})</h3>`;

 list.forEach(i=>{
  const active=favoritesArr.includes(i.issue)?"active":"";

  const div=document.createElement("div");
  div.className="card";

  div.innerHTML=`
  <b>${highlight(escapeHTML(i.issue),k)}</b>
  <div>${escapeHTML(i.category)} | ${escapeHTML(i.machine_type)}</div>

  <div class="actions">
   <button class="email"
        data-tooltip="Send by email"
        onclick="email('${encodeURIComponent(i.issue)}')">
📤
</button>
   <button class="copy"
        data-tooltip="Copy process"
        onclick="copy(this, \`${escapeHTML(i.process)}\`)">
📋
</button>

<div class="copy-feedback">Copied ✓</div>
  <button class="fav ${active}"
        data-tooltip="Add to favorites"
        onclick="toggleFav('${i.issue}')">
⭐
</button>

  </div>

  <pre>${highlight(escapeHTML(i.process),k)}</pre>
  `;
  results.appendChild(div);
 });
}

/* FAVORITES */
function toggleFav(issue){
 if(favoritesArr.includes(issue))
  favoritesArr=favoritesArr.filter(f=>f!==issue);
 else
  favoritesArr.push(issue);

 localStorage.setItem("favorites",JSON.stringify(favoritesArr));
 applyFilters();
}

function renderFavorites(){
 const c=document.getElementById("favorites");
 c.innerHTML="";

 const favItems=data.filter(d=>favoritesArr.includes(d.issue));

 favItems.forEach(i=>{
  c.innerHTML+=`
  <div class="card">
   <b>${escapeHTML(i.issue)}</b>
   <div>${escapeHTML(i.category)} | ${escapeHTML(i.machine_type)}</div>
   <pre>${escapeHTML(i.process)}</pre>
  </div>`;
 });
}

/* FILTER BUTTONS */

function setFilter(btn, category){
 currentCategory = category;

 // remove active from all buttons
 document.querySelectorAll('#filterButtons button')
  .forEach(b => b.classList.remove('active'));

 // mark clicked button as active
 btn.classList.add('active');

 applyFilters();
}


/* HELPERS */
function copy(btn, text){
 navigator.clipboard.writeText(text);

 const card = btn.closest('.card');

 if (!card) return; // safety check

 card.classList.add("copied");

 setTimeout(() => {
  card.classList.remove("copied");
 }, 1500);
}
function email(issueEncoded){
 const issue = decodeURIComponent(issueEncoded);
 const item = data.find(d => d.issue === issue);

 if (!item) return;

 // Split lines safely (supports pasted text + Enter)
 const lines = item.process.split(/\r?\n/);

 // Keep empty lines if needed, and format bullets
 const formatted = lines.map(line => {
   return line.trim() ? `• ${line.trim()}` : "";
 }).join('\r\n');

 // ✅ VERY IMPORTANT: encode AFTER formatting
 const subject = encodeURIComponent(item.issue);
 const body = encodeURIComponent(formatted);

 // ✅ Use full mailto safely
 window.location.href = `mailto:?subject=${subject}&body=${body}`;
}function toggleTheme(){
 document.body.classList.toggle("dark");
}

/* BACK TO TOP */
function scrollToTop(){
 search.scrollIntoView({behavior:"smooth"});
}

window.addEventListener("scroll",()=>{
backToTop.style.display = window.scrollY>300 ? "block" : "none";
``});

search.addEventListener("input", () => {
 applyFilters();
 updateSearchDropdown();
});

document.addEventListener("click", (e) => {
 const dropdown = document.getElementById("searchDropdown");

 if (!e.target.closest("#search") && !e.target.closest("#searchDropdown")) {
   dropdown.style.display = "none";
 }
});



/* ADMIN SHORTCUT */
document.addEventListener("keydown",e=>{
 if(e.ctrlKey && e.shiftKey && e.key==="U"){
  adminPanel.style.display="block";
 }
});

/* LOAD */
async function load(){
 const res=await fetch("https://raw.githubusercontent.com/naderlabib-afk/support-processes/refs/heads/main/processes.json");
 data=await res.json();
 applyFilters();
}
load();

/* DOWNLOAD JSON */
function downloadJSON(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="processes.json";
 a.click();
}

function updateSearchDropdown() {
 const dropdown = document.getElementById("searchDropdown");
 const query = search.value.toLowerCase();

 if (!query) {
   dropdown.style.display = "none";
   return;
 }

 const matches = data
   .filter(i =>
     i.issue.toLowerCase().includes(query) ||
     i.process.toLowerCase().includes(query)
   )
   .slice(0, 8);

 if (matches.length === 0) {
   dropdown.style.display = "none";
   return;
 }

 dropdown.innerHTML = "";

 matches.forEach(item => {
   const div = document.createElement("div");
   div.className = "search-item";
   div.textContent = item.issue;

   div.onclick = () => {
     search.value = item.issue;
     dropdown.style.display = "none";
     applyFilters();
   };

   dropdown.appendChild(div);
 });

 dropdown.style.display = "block";
}

</script>

</body>
</html>
