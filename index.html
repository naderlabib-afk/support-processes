<html>
<head>
  <title>Support Process Finder</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f5f6fa; }
    h2 { color: #2f3640; }

    .search-box {
      position: relative;
      width: 350px;
    }

    input {
      width: 100%;
      padding: 10px;
    }

    .suggestions {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
    }

    .suggestion {
      padding: 8px;
      cursor: pointer;
    }

    .suggestion:hover, .active {
      background: #dcdde1;
    }

    .buttons button {
      margin: 5px;
      padding: 8px;
      background: #40739e;
      color: white;
      border: none;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 15px;
      margin-top: 10px;
      border-radius: 6px;
    }

    pre {
      background: #f1f2f6;
      padding: 10px;
      white-space: pre-wrap;
    }

    mark { background: yellow; }
  </style>
</head>
<body>

<h2>🔍 Support Process Finder</h2>

<div class="search-box">
  <input type="text" id="search" placeholder="Search issue, contract, GPU...">
  <div id="suggestions" class="suggestions"></div>
</div>

<div class="buttons">
  <button onclick="filterCategory('')">All</button>
  <button onclick="filterCategory('Contract')">Contract</button>
  <button onclick="filterCategory('Location')">Location</button>
  <button onclick="filterCategory('Customer')">Customer</button>
  <button onclick="filterCategory('Machine Type')">Machine</button>
  <button onclick="filterCategory('Part')">Part</button>
</div>

<div id="results"></div>

<script>
function getDataUrl() {
  return `https://raw.githubusercontent.com/naderlabib-afk/support-processes/refs/heads/main/processes.json?t=${new Date().getTime()}`;
}
  

let data = [];
let currentCategory = "";
let suggestionIndex = -1;

// Load data
async function loadData() {
  const res = await fetch(getDataUrl());
  data = await res.json();
  display(data);
}

// Extract suggestion pool
function getSuggestions(keyword) {
  const set = new Set();

  data.forEach(item => {
    if (item.issue.toLowerCase().includes(keyword)) set.add(item.issue);
    if (item.category.toLowerCase().includes(keyword)) set.add(item.category);
    if (item.machine_type.toLowerCase().includes(keyword)) set.add(item.machine_type);
  });

  return Array.from(set).slice(0, 8);
}

// Show suggestions
function showSuggestions(list) {
  const container = document.getElementById("suggestions");
  container.innerHTML = "";

  list.forEach((text, index) => {
    const div = document.createElement("div");
    div.className = "suggestion";
    div.innerText = text;

    div.onclick = () => {
      document.getElementById("search").value = text;
      container.innerHTML = "";
      search();
    };

    container.appendChild(div);
  });
}

// Smart search
function search() {
  const keyword = document.getElementById("search").value.toLowerCase().trim();

  let results = data.map(item => {
    let score = 0;

    const issue = item.issue.toLowerCase();
    const process = item.process.toLowerCase();

    if (keyword) {
      if (issue === keyword) score += 100;
      else if (issue.startsWith(keyword)) score += 70;
      else if (issue.includes(keyword)) score += 50;

      if (process.includes(keyword)) score += 10;
    }

    if (currentCategory && item.category !== currentCategory) {
      score = 0;
    }

    return { ...item, score };
  });

  if (keyword) results = results.filter(r => r.score > 0);

  results.sort((a, b) => b.score - a.score);

  display(results);
}

// Highlight
function highlight(text, keyword) {
  if (!keyword) return text;
  const regex = new RegExp(`(${keyword})`, "gi");
  return text.replace(regex, "<mark>$1</mark>");
}

// Display
function display(results) {
  const container = document.getElementById("results");
  const keyword = document.getElementById("search").value.toLowerCase();

  container.innerHTML = "";

  if (!results.length) {
    container.innerHTML = "<p>No results found</p>";
    return;
  }

  results.slice(0, 15).forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${highlight(item.issue, keyword)}</b><br>
      <i>${item.category} | ${item.machine_type}</i>
      <pre>${highlight(item.process, keyword)}</pre>
    `;

    container.appendChild(div);
  });
}

// Category filter
function filterCategory(cat) {
  currentCategory = cat;
  search();
}

// Input event
document.getElementById("search").addEventListener("input", function() {
  const keyword = this.value.toLowerCase();

  if (!keyword) {
    document.getElementById("suggestions").innerHTML = "";
    search();
    return;
  }

  const suggestions = getSuggestions(keyword);
  showSuggestions(suggestions);
  search();
});

// Keyboard navigation
document.getElementById("search").addEventListener("keydown", function(e) {
  const items = document.querySelectorAll(".suggestion");

  if (e.key === "ArrowDown") {
    suggestionIndex++;
  } else if (e.key === "ArrowUp") {
    suggestionIndex--;
  } else if (e.key === "Enter" && suggestionIndex >= 0) {
    this.value = items[suggestionIndex].innerText;
    document.getElementById("suggestions").innerHTML = "";
    search();
    suggestionIndex = -1;
    return;
  }

  items.forEach(i => i.classList.remove("active"));

  if (items[suggestionIndex]) {
    items[suggestionIndex].classList.add("active");
  }
});

loadData();
</script>

</body>
