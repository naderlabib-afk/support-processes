<!DOCTYPE html>
<html>
<button onclick="toggleAdmin()" style="margin:10px;">🔐 Admin</button>
<div id="adminPanel" style="display:none; background:#fff; padding:15px; margin:20px; border-radius:10px;">
  <h3>Admin Panel</h3>

  <input id="adminPass" type="password" placeholder="Enter password">
  <button onclick="unlockAdmin()">Unlock</button>

  <div id="adminContent" style="display:none; margin-top:15px;">

    <h4>Add / Edit Process</h4>

    <input id="cat" placeholder="Category"><br><br>
    <input id="machine" placeholder="Machine Type"><br><br>
    <input id="issue" placeholder="Issue"><br><br>
    <textarea id="process" placeholder="Process steps..." style="width:100%; height:100px;"></textarea><br><br>

    <button onclick="saveProcess()">💾 Save</button>
    <button onclick="clearForm()">Clear</button>

    <h4>All Processes</h4>
    <div id="adminList"></div>

    <button onclick="downloadJSON()">⬇ Download JSON</button>

  </div>
</div>

<head>
  <title>Process Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #eef2f7;
      --card: white;
      --text: #2f3640;
      --primary: #273c75;
      --accent: #40739e;
    }

    body.dark {
      --bg: #1e272e;
      --card: #2f3640;
      --text: #f5f6fa;
      --primary: #487eb0;
      --accent: #00a8ff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    header {
      backdrop-filter: blur(10px);
      background: rgba(39,60,117,0.9);
      color: white;
      padding: 15px 20px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
    }

    .buttons button {
      margin: 4px;
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .title {
      font-weight: bold;
      font-size: 16px;
    }

    .meta {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .actions button {
      margin-right: 5px;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .email { background: #00a8ff; color: white; }
    .copy { background: #9c88ff; color: white; }
    .fav { background: #fbc531; }

    pre {
      background: rgba(0,0,0,0.05);
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: black;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      opacity: 0;
      transition: 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    .topbar {
      display: flex;
      gap: 10px;
    }

    .toggle {
      cursor: pointer;
      background: white;
      border-radius: 20px;
      padding: 5px 10px;
      color: black;
    }
  </style>
</head>

<body>

<header>
  🔧 Process Finder
  <div class="topbar">
    <div class="toggle" onclick="toggleTheme()">🌙</div>
  </div>
</header>

<div class="container">

<input type="text" id="search" placeholder="Search anything...">

<div class="buttons">
  <button onclick="filterCategory('')">All</button>
  <button onclick="filterCategory('Contract')">Contract</button>
  <button onclick="filterCategory('Location')">Location</button>
  <button onclick="filterCategory('Customer')">Customer</button>
  <button onclick="filterCategory('Machine Type')">Machine</button>
  <button onclick="filterCategory('Part')">Part</button>
  <button onclick="filterCategory('Special Handling')">Special</button>
  <button onclick="filterCategory('Logistics')">Logistics</button>
</div>

<h3>⭐ Favorites</h3>
<div id="favorites"></div>

<div id="results"></div>

</div>

<div id="toast" class="toast"></div>

<script>

const ADMIN_PASSWORD = "1234"; // change this
let editIndex = null;

// Show panel
function toggleAdmin() {
  const panel = document.getElementById("adminPanel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}

// Unlock
function unlockAdmin() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminContent").style.display = "block";
    renderAdminList();
  } else {
    alert("Wrong password");
  }
}

// Save process
function saveProcess() {
  const item = {
    category: document.getElementById("cat").value,
    machine_type: document.getElementById("machine").value,
    issue: document.getElementById("issue").value,
    process: document.getElementById("process").value
  };

  if (!item.issue) return alert("Issue required");

  if (editIndex !== null) {
    data[editIndex] = item;
    editIndex = null;
  } else {
    data.push(item);
  }

  render();
  renderAdminList();
  clearForm();
}

// Edit
function editProcess(index) {
  const item = data[index];
  document.getElementById("cat").value = item.category;
  document.getElementById("machine").value = item.machine_type;
  document.getElementById("issue").value = item.issue;
  document.getElementById("process").value = item.process;

  editIndex = index;
}

// Delete
function deleteProcess(index) {
  if (!confirm("Delete this process?")) return;
  data.splice(index, 1);
  render();
  renderAdminList();
}

// Render admin list
function renderAdminList() {
  const container = document.getElementById("adminList");
  container.innerHTML = "";

  data.forEach((item, index) => {
    container.innerHTML += `
      <div style="border-bottom:1px solid #ccc; padding:5px;">
        <b>${item.issue}</b>
        <button onclick="editProcess(${index})">✏️</button>
        <button onclick="deleteProcess(${index})">❌</button>
      </div>
    `;
  });
}

// Clear form
function clearForm() {
  ["cat","machine","issue","process"].forEach(id => document.getElementById(id).value = "");
  editIndex = null;
}

// Download JSON
function downloadJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "processes.json";
  a.click();

  URL.revokeObjectURL(url);
}
function getDataUrl() {
  return `https://raw.githubusercontent.com/naderlabib-afk/support-processes/refs/heads/main/processes.json?t=${new Date().getTime()}`;
}

let data = [];
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let currentCategory = "";

// Load
async function loadData() {
  const res = await fetch(getDataUrl());
  data = await res.json();
  render();
}

setInterval(loadData, 30000);

// Render
function render() {
  search(); // ensures filtering + search apply
  displayFavorites();
}

// Search
document.getElementById("search").addEventListener("input", search);

function search() {
  const k = document.getElementById("search").value.toLowerCase();

  const results = data.filter(i =>
    (!k ||
      i.issue.toLowerCase().includes(k) ||
      i.process.toLowerCase().includes(k) ||
      i.category.toLowerCase().includes(k) ||
      i.machine_type.toLowerCase().includes(k)
    ) &&
    (!currentCategory || i.category === currentCategory)
  );

  display(results);
}

// Display
function display(list) {
  const container = document.getElementById("results");
  container.innerHTML = "";

  if (!list.length) {
    container.innerHTML = "<p>No results found</p>";
    return;
  }

  list.slice(0,15).forEach(item => {
    container.innerHTML += `
      <div class="card">
        <div class="title">${item.issue}</div>
        <div class="meta">${item.category} | ${item.machine_type}</div>

        <div class="actions">
          <button class="email" onclick="email('${encodeURIComponent(item.issue)}')">📧</button>
          <button class="copy" onclick="copy(\`${item.process}\`)">📋</button>
          <button class="fav" onclick="toggleFav('${item.issue}')">⭐</button>
        </div>

        <pre>${item.process}</pre>
      </div>
    `;
  });
}

// Favorites
function toggleFav(issue) {
  if (favorites.includes(issue))
    favorites = favorites.filter(f => f !== issue);
  else
    favorites.push(issue);

  localStorage.setItem("favorites", JSON.stringify(favorites));
  showToast("Favorites updated");
  displayFavorites();
}

function displayFavorites() {
  const container = document.getElementById("favorites");
  container.innerHTML = "";

  favorites.forEach(f => {
    const item = data.find(d => d.issue === f);
    if (item) {
      container.innerHTML += `<div class="card"><b>${item.issue}</b></div>`;
    }
  });
}

// Email
function email(issueEncoded) {
  const issue = decodeURIComponent(issueEncoded);
  const item = data.find(d => d.issue === issue);

  window.location.href =
    `mailto:?subject=${encodeURIComponent(item.issue)}&body=${encodeURIComponent(item.process)}`;
}

// Copy
function copy(text) {
  navigator.clipboard.writeText(text);
  showToast("Copied!");
}

// Toast
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

// Theme
function toggleTheme() {
  document.body.classList.toggle("dark");
}

// Filter
function filterCategory(cat) {
  currentCategory = cat;
  search();
}

// Init
loadData();
</script>

</body>
</html>
