<!DOCTYPE html>
<html>
<head>
  <title>Support Process Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      background: #eef2f7;
      color: #2f3640;
    }

    header {
      background: #273c75;
      color: white;
      padding: 15px 25px;
      font-size: 20px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .suggestions {
      position: absolute;
      width: 100%;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-top: 3px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .suggestion {
      padding: 10px;
      cursor: pointer;
    }

    .suggestion:hover {
      background: #f1f2f6;
    }

    .buttons {
      margin-bottom: 15px;
    }

    .buttons button {
      padding: 8px 14px;
      margin: 4px;
      border-radius: 20px;
      border: none;
      background: #40739e;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .buttons button:hover {
      background: #273c75;
    }

    .refresh {
      margin-bottom: 15px;
    }

    .refresh button {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: #44bd32;
      color: white;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .meta {
      font-size: 12px;
      color: #718093;
      margin-bottom: 10px;
    }

    .actions {
      margin-bottom: 10px;
    }

    .actions button {
      padding: 6px 10px;
      margin-right: 5px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
    }

    .email-btn {
      background: #0097e6;
      color: white;
    }

    .copy-btn {
      background: #8c7ae6;
      color: white;
    }

    pre {
      background: #f5f6fa;
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
      font-size: 13px;
    }

    mark {
      background: #ffeaa7;
    }
  </style>
</head>

<body>

<header>🔧 Support Process Finder</header>

<div class="container">

  <div class="search-box">
    <input type="text" id="search" placeholder="Search issue, contract, GPU...">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="buttons">
    <button onclick="filterCategory('')">All</button>
    <button onclick="filterCategory('Contract')">Contract</button>
    <button onclick="filterCategory('Location')">Location</button>
    <button onclick="filterCategory('Customer')">Customer</button>
    <button onclick="filterCategory('Machine Type')">Machine</button>
    <button onclick="filterCategory('Part')">Part</button>
  </div>

  <div class="refresh">
    <button onclick="loadData()">🔄 Refresh</button>
  </div>

  <div id="results"></div>

</div>

<script>
function getDataUrl() {
  return `https://raw.githubusercontent.com/naderlabib-afk/support-processes/refs/heads/main/processes.json?t=${new Date().getTime()}`;
}

let data = [];
let currentCategory = "";

// Load data
async function loadData() {
  const res = await fetch(getDataUrl());
  data = await res.json();
  display(data);
}



// Suggestions
function getSuggestions(keyword) {
  const set = new Set();

  data.forEach(item => {
    if (item.issue.toLowerCase().includes(keyword)) set.add(item.issue);
    if (item.category.toLowerCase().includes(keyword)) set.add(item.category);
  });

  return Array.from(set).slice(0, 6);
}

function showSuggestions(list) {
  const container = document.getElementById("suggestions");
  container.innerHTML = "";

  list.forEach(text => {
    const div = document.createElement("div");
    div.className = "suggestion";
    div.innerText = text;

    div.onclick = () => {
      document.getElementById("search").value = text;
      container.innerHTML = "";
      search();
    };

    container.appendChild(div);
  });
}

// Search
function search() {
  const keyword = document.getElementById("search").value.toLowerCase().trim();

  let results = data.filter(item =>
    (!keyword ||
      item.issue.toLowerCase().includes(keyword) ||
      item.process.toLowerCase().includes(keyword)
    ) &&
    (!currentCategory || item.category === currentCategory)
  );

  display(results);
}

// Highlight
function highlight(text, keyword) {
  if (!keyword) return text;
  return text.replace(new RegExp(`(${keyword})`, "gi"), "<mark>$1</mark>");
}

// Display
function display(results) {
  const container = document.getElementById("results");
  const keyword = document.getElementById("search").value.toLowerCase();

  container.innerHTML = "";

  if (!results.length) {
    container.innerHTML = "<p>No results found</p>";
    return;
  }

  results.slice(0, 15).forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="title">${highlight(item.issue, keyword)}</div>
      <div class="meta">${item.category} | ${item.machine_type}</div>

      <div class="actions">
        <button class="email-btn" onclick="shareEmail('${encodeURIComponent(item.issue)}')">📧 Email</button>
        <button class="copy-btn" onclick="copyProcess(\`${item.process}\`)">📋 Copy</button>
      </div>

      <pre>${highlight(item.process, keyword)}</pre>
    `;

    container.appendChild(div);
  });
}

// Email
function shareEmail(issueEncoded) {
  const issue = decodeURIComponent(issueEncoded);
  const item = data.find(d => d.issue === issue);
  if (!item) return;

  const subject = `Support Process: ${item.issue}`;
  const body = `Process:\n\n${item.process}`;

  window.location.href =
    `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

// Copy
function copyProcess(text) {
  navigator.clipboard.writeText(text);
  alert("📋 Process copied!");
}

// Filter
function filterCategory(cat) {
  currentCategory = cat;
  search();
}

// Events
document.getElementById("search").addEventListener("input", function() {
  const keyword = this.value.toLowerCase();

  if (!keyword) {
    document.getElementById("suggestions").innerHTML = "";
    search();
    return;
  }

  showSuggestions(getSuggestions(keyword));
  search();
});

loadData();
</script>

</body>
</html>
