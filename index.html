<!DOCTYPE html>
<html>
<head>
  <title>Process Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #eef2f7;
      --card: white;
      --text: #2f3640;
      --accent: #40739e;
    }

    body.dark {
      --bg: #1e272e;
      --card: #2f3640;
      --text: #f5f6fa;
      --accent: #00a8ff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    header {
      background: rgba(39,60,117,0.9);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      position: sticky;
      top: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    .buttons button {
      margin: 4px;
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .title { font-weight: bold; }
    .meta { font-size: 12px; opacity: 0.7; margin-bottom: 8px; }

    .actions button {
      margin-right: 5px;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      position: relative;
    }

    .email { background: #00a8ff; color: white; }
    .copy { background: #9c88ff; color: white; }
    .fav { background: #fbc531; }

    /* TOOLTIP */
    .actions button:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      white-space: nowrap;
      z-index: 10;
    }

    pre {
      background: rgba(0,0,0,0.05);
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: black;
      color: white;
      padding: 10px;
      border-radius: 8px;
      opacity: 0;
      transition: 0.3s;
    }

    .toast.show { opacity: 1; }
  </style>
</head>

<body>

<header>
  🔧 Process Finder
  <button onclick="toggleTheme()">🌙</button>
</header>

<div class="container">

<input type="text" id="search" placeholder="Search...">

<div class="buttons">
  <button onclick="filterCategory('')">All</button>
  <button onclick="filterCategory('Contract')">Contract</button>
  <button onclick="filterCategory('Location')">Location</button>
  <button onclick="filterCategory('Customer')">Customer</button>
  <button onclick="filterCategory('Machine Type')">Machine</button>
</div>

<h3>⭐ Favorites</h3>
<div id="favorites"></div>

<div id="results"></div>

<hr>

<!-- ADMIN -->
<button onclick="toggleAdmin()">🔐 Admin</button>

<div id="adminPanel" style="display:none; background:#fff; padding:15px; margin-top:10px; border-radius:10px;">
  <h3>Admin Panel</h3>

  <input id="adminPass" type="password" placeholder="Enter password">
  <button onclick="unlockAdmin()">Unlock</button>

  <div id="adminContent" style="display:none; margin-top:10px;">

    <input id="cat" placeholder="Category">
    <input id="machine" placeholder="Machine Type">
    <input id="issue" placeholder="Issue">
    <textarea id="process" placeholder="Process"></textarea>

    <button onclick="saveProcess()">💾 Save</button>
    <button onclick="clearForm()">Clear</button>

    <h4>All Processes</h4>
    <div id="adminList"></div>

    <button onclick="downloadJSON()">⬇ Download JSON</button>
  </div>
</div>

</div>

<div id="toast" class="toast"></div>

<script>

const ADMIN_PASSWORD = "1234";

let data = [];
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let currentCategory = "";
let editIndex = null;

/* ================= ADMIN ================= */

function toggleAdmin() {
  const p = document.getElementById("adminPanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
}

function unlockAdmin() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminContent").style.display = "block";
    renderAdminList();
  } else alert("Wrong password");
}

function saveProcess() {
  const item = {
    category: cat.value,
    machine_type: machine.value,
    issue: issue.value,
    process: process.value
  };

  if (!item.issue) return alert("Issue required");

  if (editIndex !== null) {
    data[editIndex] = item;
    editIndex = null;
  } else {
    data.push(item);
  }

  applyFilters();
  renderAdminList();
  clearForm();
}

function editProcess(i) {
  const d = data[i];
  cat.value = d.category;
  machine.value = d.machine_type;
  issue.value = d.issue;
  process.value = d.process;
  editIndex = i;
}

function deleteProcess(i) {
  data.splice(i,1);
  applyFilters();
  renderAdminList();
}

function renderAdminList() {
  const c = document.getElementById("adminList");
  c.innerHTML = "";
  data.forEach((d,i)=>{
    c.innerHTML += `
      <div>
        <b>${d.issue}</b>
        <button onclick="editProcess(${i})">✏️</button>
        <button onclick="deleteProcess(${i})">❌</button>
      </div>`;
  });
}

function clearForm(){
  cat.value = machine.value = issue.value = process.value = "";
}

/* ================= SEARCH CORE FIX ================= */

document.getElementById("search").addEventListener("input", applyFilters);

function applyFilters() {
  const k = document.getElementById("search").value.toLowerCase();

  const filtered = data.filter(i => {
    const matchSearch =
      !k ||
      i.issue.toLowerCase().includes(k) ||
      i.process.toLowerCase().includes(k) ||
      i.category.toLowerCase().includes(k) ||
      i.machine_type.toLowerCase().includes(k);

    const matchCat =
      !currentCategory || i.category === currentCategory;

    return matchSearch && matchCat;
  });

  renderList(filtered);
  renderFavorites();
}

function renderList(list) {
  const r = document.getElementById("results");
  r.innerHTML = "";

  if (!list.length) {
    r.innerHTML = "<p>No results found</p>";
    return;
  }

  list.slice(0,15).forEach(i=>{
    r.innerHTML += `
      <div class="card">
        <div class="title">${i.issue}</div>
        <div class="meta">${i.category} | ${i.machine_type}</div>

        <div class="actions">
          <button class="email" data-tooltip="Share by email"
            onclick="email('${encodeURIComponent(i.issue)}')">📤</button>

          <button class="copy" data-tooltip="Copy process"
            onclick="copy(\`${i.process}\`)">📋</button>

          <button class="fav" data-tooltip="Favorite"
            onclick="toggleFav('${i.issue}')">⭐</button>
        </div>

        <pre>${i.process}</pre>
      </div>`;
  });
}

/* ================= FAVORITES ================= */

function toggleFav(issue){
  if(favorites.includes(issue))
    favorites = favorites.filter(f=>f!==issue);
  else favorites.push(issue);

  localStorage.setItem("favorites", JSON.stringify(favorites));
  applyFilters();
}

function renderFavorites(){
  const c = document.getElementById("favorites");
  c.innerHTML = "";

  favorites.forEach(f=>{
    const i = data.find(d=>d.issue===f);
    if(i) c.innerHTML += `<div class="card">${i.issue}</div>`;
  });
}

/* ================= OTHER ================= */

function filterCategory(c){
  currentCategory = c;
  applyFilters();
}


  
function copy(text){
  navigator.clipboard.writeText(text);
  showToast("Copied!");
}

function email(issueEncoded){
  const issue = decodeURIComponent(issueEncoded);
  const item = data.find(d=>d.issue===issue);
  window.location.href =
    `mailto:?subject=${item.issue}&body=${item.process}`;
}

function showToast(t){
  const x = document.getElementById("toast");
  x.innerText = t;
  x.classList.add("show");
  setTimeout(()=>x.classList.remove("show"),1500);
}

function toggleTheme(){
  document.body.classList.toggle("dark");
}

async function load(){
  const res = await fetch("https://raw.githubusercontent.com/naderlabib-afk/support-processes/refs/heads/main/processes.json");
  data = await res.json();
  applyFilters();
}


// Hidden Admin Shortcut
document.addEventListener("keydown", e => {

  // CTRL + SHIFT + A
  if (e.ctrlKey && e.shiftKey && e.key === "A") {

    unlockAdmin();

  }

});
  
load();

function downloadJSON(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "processes.json";
  a.click();
}

</script>

</body>
</html>
